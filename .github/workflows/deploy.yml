name: Build and publish deploy artifact

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          rm -rf deploy
          mkdir -p deploy
          # configs y public
          cp package.json package-lock.json next.config.ts deploy/
          cp -r scripts deploy/scripts
          cp -r public deploy/public
          # copiar la carpeta .next completa para que incluya BUILD_ID y manifests
          cp -r .next deploy/.next
          # limpiar caché innecesaria
          rm -rf deploy/.next/cache deploy/.next/server

      - name: Publish to deploy branch (force push via worktree)
        env:
          MSG: "deploy: ${{ github.event.head_commit.message }} (sha: ${{ github.sha }})"
        run: |
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          rm -rf /tmp/deploy-wt
          git worktree add /tmp/deploy-wt deploy || git worktree add -B deploy /tmp/deploy-wt origin/deploy
          rm -rf /tmp/deploy-wt/*
          cp -r deploy/. /tmp/deploy-wt/
          cd /tmp/deploy-wt
          git add .
          git commit -m "$MSG" || true
          git push -f origin HEAD:deploy
