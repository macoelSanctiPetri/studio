name: Build and publish deploy artifact

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          rm -rf .next/cache node_modules
          rm -rf deploy
          mkdir -p deploy/.next
          # configs y public
          cp package.json package-lock.json next.config.ts deploy/
          cp -r public deploy/public
          # estructura esperada por Next standalone: .next/standalone y .next/static
          cp -r .next/static deploy/.next/static
          cp -r .next/standalone deploy/.next/standalone

      - name: Publish to deploy branch (force push)
        run: |
          cd deploy
          git init
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -m "deploy: ${{ github.event.head_commit.message }} (sha: ${{ github.sha }})" || true
          git branch -M deploy
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git config --global --add safe.directory "$PWD"
          git push -f origin deploy
