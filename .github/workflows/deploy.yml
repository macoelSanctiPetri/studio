name: Build and publish deploy artifact

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          rm -rf .next/cache node_modules
          mkdir -p deploy/.next
          # configs y public
          cp package.json package-lock.json next.config.ts deploy/
          cp -r public deploy/public
          # estructura esperada por Next standalone: .next/standalone y .next/static
          cp -r .next/static deploy/.next/static
          cp -r .next/standalone deploy/.next/standalone

      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./deploy
          publish_branch: deploy
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }} - ${{ github.event.head_commit.message }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}
